name: Performance

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  k6:
    name: Testes de performance com k6
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar k6
        uses: grafana/setup-k6-action@v1

      - name: Criar arquivo .env.test para performance
        shell: bash
        run: |
          cat <<'EOF' > .env.test
          PORT=3001
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_NAME=guild_horde_wow_classic_test
          DB_USER=root
          DB_PASSWORD=root
          JWT_SECRET=ci-performance-secret
          JWT_EXPIRES_IN=1h
          EOF

      - name: Inicializar banco de teste
        run: npm run db:init:test

      - name: Executar suíte de performance
        env:
          ENV_FILE: .env.test
          K6_RESULTS_DIR: k6-results
        run: npm run test:performance

      - name: Publicar resultados do k6
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: k6-results
          if-no-files-found: warn
          retention-days: 14
